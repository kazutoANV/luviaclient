name: Build Luvia Client

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q -o gradle-2.14.1-bin.zip -d "$HOME"

      - name: Extract Luvia Client
        run: |
          set -e

          rm -rf LuviaClient

          mkdir -p LuviaClient

          unzip -q -o LuviaClient_2.4_FIXED.zip -d LuviaClient

          cd LuviaClient

          # ZIP ichidagi GitHub workflow'ni olib tashlaymiz
          rm -rf .github

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== BUILD.GRADLE ====="
          cat build.gradle

      - name: Build Forge 1.8.9
        working-directory: LuviaClient
        run: |
          set -e

          "$HOME/gradle-2.14.1/bin/gradle" \
            setupDecompWorkspace \
            build \
            --no-daemon \
            --stacktrace

      - name: Show generated JAR
        run: |
          echo "===== GENERATED JAR FILES ====="
          find LuviaClient/build/libs -type f -name "*.jar" -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LuviaClient-2.4
          path: LuviaClient/build/libs/*.jar
          if-no-files-found: error
